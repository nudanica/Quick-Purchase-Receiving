<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FDEEF5">
<title>SURU Quick Purchase List</title>
<style>
:root{
  --paper:#FDEEF5; --card:#FFFFFF; --ink:#2B2130; --ink2:#9B8AA3; --line:#F6DCE8;
  --pop:#EC3E90; --pop-dark:#C42873; --pop-soft:#FCE4EF;
  --tag:#FBBF24; --tag-dark:#D99A00; --ok:#22C55E; --sky:#38BDF8; --plum:#A78BFA;
  --shadow:0 1px 2px rgba(236,62,144,.06), 0 6px 20px rgba(236,62,144,.10);
  --font:"Noto Sans Thai","Sarabun",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:linear-gradient(180deg,#FDEEF5 0%,#FCE8F1 40%,#FDEEF5 100%);background-attachment:fixed;color:var(--ink);font-size:16px;line-height:1.45;
  padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:0;z-index:30;background:rgba(253,238,245,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 16px 10px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.logo{font-family:"Brush Script MT","Segoe Script","Snell Roundhand",cursive;font-size:26px;font-weight:700;color:var(--pop);transform:rotate(-4deg);flex:none;line-height:1;padding:0 2px}
.cv{margin-left:auto;font-size:11px;color:var(--pop);flex:none}
.tripchip{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:8px 15px;box-shadow:var(--shadow);transition:transform .12s}
.tripchip:active{transform:scale(.98)}
.tripchip b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tripchip small{color:var(--ink2);font-size:12px;flex:none}
.gear{flex:none;width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;position:relative;color:var(--pop)}
.gear svg{width:18px;height:18px}
.dot{position:absolute;right:-1px;top:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--paper)}
.dot.on{background:var(--ok)} .dot.wait{background:var(--tag)} .dot.off{background:#D9C7D3}
.wrap{padding:14px;max-width:560px;margin:0 auto}

.cambtn{width:100%;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;padding:8px 0 2px;transition:transform .12s}
.cambtn:active{transform:scale(.97)}
.camsvg{width:200px;max-width:70%;height:auto;filter:drop-shadow(0 6px 0 #D64890)}
.camcap{text-align:center;margin-top:12px}
.camcap b{display:block;font-size:19px;font-weight:800;color:var(--pop)}
.camcap i{display:block;font-style:normal;font-size:12px;color:#C9799F;margin-top:2px}
.uplink{display:inline-flex;align-items:center;gap:7px;background:var(--card);border-radius:999px;
  padding:10px 18px;margin:14px auto 2px;box-shadow:0 2px 8px rgba(236,62,144,.14);border:1.5px solid #F3C9DD;cursor:pointer}
.uplink:active{transform:scale(.97)}
.uplink svg{width:17px;height:17px;color:var(--pop)}
.uplink span{font-size:13px;font-weight:800;color:var(--pop)}
.camrow{display:flex;flex-direction:column;align-items:center}
.pickcard{display:flex;gap:10px;align-items:stretch;margin-bottom:11px;min-height:88px}
.pickmain{flex:1;min-width:0;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);text-align:left}
.pickmain:active{transform:scale(.985)}
.pickmain .th{width:60px;height:60px;border-radius:14px;object-fit:cover;flex:none;background:var(--pop-soft)}
.pickmain .body{flex:1;min-width:0}
.pickmain .nm{font-size:15px;font-weight:800;color:var(--ink);line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pickmain .meta{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.35}
.allbtn{flex:none;align-self:stretch;width:118px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#FB8FC4,#EC3E90);color:#fff;
  font-size:13px;font-weight:800;border-radius:18px;box-shadow:0 3px 0 var(--pop-dark);white-space:nowrap;text-align:center}
.allbtn:active{transform:translateY(1px);box-shadow:0 2px 0 var(--pop-dark)}
/* ===== ขนส่ง (carrier) ===== */
.carrierpick{width:100%;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px;box-shadow:var(--shadow);text-align:left;cursor:pointer}
.carrierpick:active{transform:scale(.99)}
.cpick-on{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cpick-none{flex:1;color:var(--ink2);font-size:14px}
.cpick-arrow{color:var(--pop);font-size:20px;font-weight:800;flex:none}
.cname{font-size:14px;font-weight:800;color:var(--ink)}
.cmode{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px}
.cmode.sea{background:#DBEAFE;color:#2563EB}
.cmode.air{background:#FEF3C7;color:#D97706}
.carriers{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.cr{display:flex;align-items:stretch;gap:6px;background:var(--card);border-radius:13px;border:2px solid transparent;box-shadow:var(--shadow);overflow:hidden}
.cr.on{border-color:var(--pop);background:#FFF5FA}
.crmain{flex:1;display:flex;align-items:center;gap:10px;padding:12px;text-align:left;min-width:0}
.cr .rd{width:20px;height:20px;border-radius:50%;border:2px solid #D9C3D0;flex:none;position:relative}
.cr.on .rd{border-color:var(--pop)}
.cr.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--pop)}
.cr .nm{flex:1;font-size:14px;font-weight:700;color:var(--ink);min-width:0}
.cr.none .nm{color:var(--ink2);font-weight:600}
.crdel{flex:none;padding:0 14px;font-size:15px;background:transparent;color:var(--ink2)}
.crdel:active{background:#FEE2E2}
.credit{flex:none;padding:0 12px;font-size:15px;background:transparent;color:var(--ink2);border-right:1px solid var(--line)}
.credit:active{background:var(--pop-soft)}
.modeseg{display:flex;gap:7px;margin-bottom:12px}
.segbtn{flex:1;padding:11px 6px;border-radius:11px;font-size:13px;font-weight:800;background:var(--card);border:1.5px solid var(--line);color:var(--ink2)}
.segbtn.on{background:var(--pop-soft);border-color:var(--pop);color:var(--pop)}
.expfilter{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.expfilter .cbtn{display:flex;align-items:center;gap:9px;border-radius:11px;padding:11px 12px;background:var(--pop-soft);border:1px solid #F6C6DE;width:100%;text-align:left}
.expfilter .cbtn:active{transform:scale(.99)}
.expfilter .ci{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none;color:#fff}
.expfilter .ci.sea{background:#3B82F6}.expfilter .ci.air{background:#F59E0B}.expfilter .ci.all{background:var(--pop)}
.expfilter .cnm{flex:1;font-size:12.5px;font-weight:800;color:var(--ink)}
.expfilter .cmeta{font-size:10px;color:var(--ink2);font-weight:700}
.expfilter .cgo{font-size:17px;color:var(--pop);font-weight:800}
.expdiv{text-align:center;font-size:10px;color:var(--ink2);font-weight:700;margin:3px 0}


.bphoto-wrap{margin-bottom:14px}
.bphoto{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.bphoto img{width:100%;max-height:32vh;object-fit:contain;background:var(--pop-soft);display:block}
.bphoto .cap{display:flex;align-items:center;gap:8px;padding:10px 12px}
.bphoto .cap svg{width:15px;height:15px;color:var(--pop);flex:none}
.bphoto .cap span{font-size:11.5px;font-weight:700;color:var(--pop);flex:1;line-height:1.3}
.bphoto .cap .re{font-size:11px;color:var(--ink2);font-weight:700}
.addbphoto{width:100%;background:var(--card);border:2px dashed #F3B6D2;border-radius:16px;padding:20px;text-align:center}
.addbphoto:active{transform:scale(.98)}
.addbphoto svg{width:28px;height:28px;color:var(--pop);margin-bottom:5px}
.addbphoto .t{font-size:14px;font-weight:800;color:var(--pop)}
.addbphoto .s{font-size:11px;color:#C9799F;margin-top:2px}

.shot{position:relative;border-radius:14px;overflow:hidden;background:#000;box-shadow:var(--shadow)}
.shot img{display:block;width:100%;max-height:46vh;object-fit:contain;background:#2B2130}
.shot .retake{position:absolute;right:10px;bottom:10px;background:rgba(23,32,58,.86);color:#fff;
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700}

.field{margin-top:14px}
.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink2);
  margin-bottom:6px;text-transform:uppercase}
.money{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.money .cur{display:flex;align-items:center;padding:0 16px;background:var(--pop-soft);font-weight:800;font-size:13px;
  color:var(--pop);border-right:1px solid var(--line)}
.money input{flex:1;min-width:0;border:none;background:none;padding:16px 14px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.money input:focus{outline:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:58px;height:58px;border-radius:16px;background:var(--card);border:1px solid var(--line);
  color:var(--pop);font-size:26px;font-weight:800;box-shadow:var(--shadow);flex:none}
.stepper input{flex:1;min-width:0;text-align:center;font-size:30px;font-weight:800;padding:12px 4px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stepper input:focus{outline:none;border-color:var(--pop)}
.rowline{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:14px;
  border-top:2px dashed #F1CFE0}
.rowline span{font-size:13px;color:var(--ink2);font-weight:700}
.rowline b{font-size:28px;letter-spacing:-.02em}
.save{width:100%;margin-top:16px;background:linear-gradient(135deg,#F569AC,var(--pop));color:#fff;font-size:18px;font-weight:800;
  padding:17px;border-radius:16px;box-shadow:0 3px 0 var(--pop-dark), var(--shadow);letter-spacing:.01em}
.save:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pop-dark)}
.save[disabled]{background:#EBDCE4;box-shadow:none;color:#B6A3B0}
.hint{font-size:12px;color:var(--ink2);margin-top:10px;text-align:center}
.switchrow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--ink2)}
.switchrow input{width:18px;height:18px;accent-color:var(--pop)}

.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
.sectionhead h2{margin:0;font-size:14px;letter-spacing:.02em;font-weight:800;color:var(--ink);
  display:flex;align-items:center;gap:8px}
.sectionhead h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pop);flex:none}
.sectionhead em{font-style:normal;font-size:12px;color:var(--ink2);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px 12px;box-shadow:var(--shadow);
  position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(90deg,#F776B4,var(--pop))}
.stat:nth-child(2)::before{background:linear-gradient(90deg,#FCD34D,var(--tag-dark))}
.stat:nth-child(3)::before{background:linear-gradient(90deg,#4ADE80,#16A34A)}
.stat .si{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:17px;margin-bottom:8px;background:var(--pop-soft);color:var(--pop)}
.stat:nth-child(2) .si{background:#FEF3C7;color:var(--tag-dark)}
.stat:nth-child(3) .si{background:#DCFCE7;color:#16A34A}
.stat u{display:block;text-decoration:none;font-size:10.5px;color:var(--ink2);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:2px;line-height:1.1}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);border-radius:16px;
  padding:10px;display:flex;gap:12px;margin-bottom:10px;position:relative;width:100%;text-align:left}
.card .th{width:78px;height:78px;flex:none;border-radius:14px;background:var(--pop-soft);object-fit:cover;box-shadow:0 2px 6px rgba(236,62,144,.12)}
.card .body{flex:1;min-width:0}
.card .nm{font-weight:800;font-size:15.5px;line-height:1.3;word-break:break-word;letter-spacing:-.01em}
.card .nm.un{color:var(--ink2);font-weight:600;font-style:italic}
.card .meta{font-size:12px;color:var(--ink2);margin-top:4px}
.qtag{position:absolute;right:10px;top:10px;background:var(--tag);color:#4A3200;font-weight:800;font-size:17px;
  padding:3px 10px 3px 14px;border-radius:4px;clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%)}
.card .foot{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acard{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pop)}
.acard.c2::before{background:var(--tag)} .acard.c3::before{background:var(--plum)}
.acard .ah{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.acard .aic{width:42px;height:42px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:var(--pop-soft);color:var(--pop)}
.acard.c2 .aic{background:#FEF3C7;color:var(--tag-dark)} .acard.c3 .aic{background:#EDE9FE;color:#7C3AED}
.acard .at{font-weight:800;font-size:16px;letter-spacing:-.01em}
.acard .ameta{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-bottom:12px}
.pill{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:#FFF6FA}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#F4EDF7;color:var(--ink2)}
.badge.run{background:var(--pop-soft);color:var(--pop)}
.badge.ok{background:#DCFCE7;color:#15803D}
.badge.err{background:#FEE2E2;color:#DC2626}
.badge.who{background:#EDE9FE;color:#6D28D9}

.suggest{background:#FFFBEB;border:1.5px solid #FCD34D;border-radius:16px;padding:13px;margin-bottom:10px}
.suggest .pair{display:flex;gap:8px;align-items:center;margin:8px 0}
.suggest .pair img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--pop-soft)}
.suggest .pair div{flex:1;min-width:0;font-size:13px;line-height:1.3}
.suggest .acts{display:flex;gap:8px;margin-top:8px}
.suggest .acts button{flex:1;padding:10px;border-radius:10px;font-weight:800;font-size:14px}
.btn-merge{background:var(--pop);color:#fff}
.btn-skip{background:#fff;border:1px solid var(--line)}

.empty{text-align:center;padding:44px 20px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.9);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;padding:8px 4px;font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--ink2);
  border-radius:14px;transition:background .15s, color .15s}
.nav button .ic{display:block;font-size:20px;margin-bottom:3px;line-height:1}
.nav button[aria-current="true"]{color:var(--pop);background:var(--pop-soft)}

.scrim{position:fixed;inset:0;background:rgba(43,33,48,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:22px 22px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet p.sub{margin:0 0 14px;font-size:13px;color:var(--ink2)}
.tin{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:16px}
.tin:focus{outline:none;border-color:var(--pop)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .go{width:100%;margin-top:14px;background:linear-gradient(135deg,#F569AC,var(--pop));color:#fff;font-weight:800;padding:16px;border-radius:14px;font-size:16px}
.sheet .ghost{width:100%;margin-top:8px;padding:14px;border-radius:12px;font-weight:700;color:var(--ink2)}
.sheet .danger{color:var(--pop)}
.buyrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;
  padding:10px 0;border-bottom:1px dashed var(--line)}
.buyrow .who{color:var(--ink2);font-size:11px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;font-weight:800;letter-spacing:.18em;
  color:var(--pop);background:var(--card);border:2px dashed var(--pop);border-radius:14px;padding:14px;text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--pop);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;
  z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}

#stage{position:fixed;left:-99999px;top:0;width:794px}
.page{width:794px;min-height:1123px;background:#fff;color:#222;padding:42px 40px;font-family:"Sarabun","Noto Sans Thai",sans-serif;box-sizing:border-box}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid #1a1a1a;padding-bottom:14px}
.dhead .dt{font-size:30px;font-weight:800;color:#1a1a1a;letter-spacing:-.01em}
.dhead .dtrip{font-size:15px;color:#888;margin-top:5px}
.dhead .brand{font-family:"Brush Script MT","Segoe Script","Snell Roundhand",cursive;font-size:34px;font-weight:700;color:#EC3E90;transform:rotate(-4deg)}
.dsum{display:flex;gap:12px;margin:18px 0 6px}
.dsc{flex:1;background:#F7F7F5;border-radius:14px;padding:14px 16px;text-align:center}
.dsc u{display:block;text-decoration:none;font-size:12px;color:#999;font-weight:700}
.dsc b{display:block;font-size:23px;font-weight:800;color:#1a1a1a;margin-top:4px}
.dgrp{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px;padding-left:14px;border-left:6px solid #EC3E90}
.dgrp .gl{font-size:18px;font-weight:800;color:#1a1a1a;line-height:1.25}
.dgrp .gl span{display:block;font-size:13px;font-weight:600;color:#999;margin-top:2px}
.dgrp .gr{text-align:right;font-size:13px;color:#999;font-weight:600}
.dgrp .gr b{display:block;font-size:21px;font-weight:800;color:#EC3E90;margin-top:2px}
.pt{width:100%;border-collapse:collapse;table-layout:fixed}
.pt th{font-size:13px;font-weight:800;color:#555;background:#F2F2F0;border:1px solid #DADAD6;padding:10px 6px;text-align:center}
.pt td{border:1px solid #DADAD6;padding:10px 8px;vertical-align:middle;text-align:center;font-size:16px}
.pt td.l{text-align:left}
.pt img{width:100%;height:96px;object-fit:contain;display:block;border-radius:8px}
.pt .nm{font-size:16px;font-weight:700;color:#1a1a1a;line-height:1.3}
.pt .q{font-size:30px;font-weight:800;color:#1a1a1a}
.pt .cost{font-size:15px;font-weight:600}
.pt .tot{font-size:15px;font-weight:700}
.pt td.blank{background:repeating-linear-gradient(0deg,transparent,transparent 21px,#eee 21px,#eee 22px)}
.chk{width:26px;height:26px;border:2px solid #999;margin:0 auto;border-radius:5px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =========================================================
   SURU Quick Purchase List v2
   บันทึกลงเครื่องก่อนเสมอ แล้วซิงก์ขึ้นเซิร์ฟเวอร์เป็นเบื้องหลัง
   ========================================================= */

const CURRENCIES = [
  {code:'JPY', sym:'¥', rate:0.23}, {code:'KRW', sym:'₩', rate:0.026},
  {code:'CNY', sym:'¥', rate:5.0},  {code:'USD', sym:'$', rate:36.0},
  {code:'EUR', sym:'€', rate:39.0}, {code:'THB', sym:'฿', rate:1}
];
const uid  = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const now  = () => Date.now();
const esc  = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt  = n => { const v=Number(n); return (isFinite(v)?Math.round(v*100)/100:0).toLocaleString('en-US',{maximumFractionDigits:2}); };

let DB = {
  v:2, device:'', deviceName:'', server:'', token:'',
  trips:[], groups:[], entries:[], boxes:[], carriers:[], sync:{},
  activeTrip:null, autoShot:true
};
let PCACHE = {};        // id -> dataURL รูปเต็ม (โหลดตามต้องการ)
let tab='add', draft=null, memOnly=false, BACKEND='memory';
let form={name:'', cost:'', qty:'1'};   // ค่าที่กำลังพิมพ์อยู่ เก็บไว้กันหายตอนหน้าจอวาดใหม่
const composing = () => tab==='add' && (draft || form.cost!=='' || form.name!=='');
let syncing=false, lastSyncOk=0;

/* ---------- storage ---------- */
const IDB = (()=>{
  let p=null;
  const open = () => p || (p = new Promise((ok,no)=>{
    const r = indexedDB.open('suru-quick-purchase', 2);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
  const run = (mode,fn) => open().then(db => new Promise((ok,no)=>{
    const q = fn(db.transaction('kv',mode).objectStore('kv'));
    q.onsuccess=()=>ok(q.result); q.onerror=()=>no(q.error);
  }));
  return { get:k=>run('readonly',s=>s.get(k)), set:(k,v)=>run('readwrite',s=>s.put(v,k)),
           del:k=>run('readwrite',s=>s.delete(k)) };
})();
const S = {
  async get(k){ try{
    if(BACKEND==='claude'){ const r=await window.storage.get(k); return r?JSON.parse(r.value):null; }
    if(BACKEND==='idb'){ const v=await IDB.get(k); return v===undefined?null:v; }
  }catch(e){} return null; },
  async set(k,v){ try{
    if(BACKEND==='claude'){ await window.storage.set(k,JSON.stringify(v)); return true; }
    if(BACKEND==='idb'){ await IDB.set(k,v); return true; }
  }catch(e){ memOnly=true; } return false; },
  async del(k){ try{ if(BACKEND==='idb') await IDB.del(k); }catch(e){} }
};
const saveMeta = () => S.set('suru:meta', DB);
const putPhoto = (id,d) => { PCACHE[id]=d; return S.set('suru:photo:'+id, d); };
async function getPhoto(id){
  if(PCACHE[id]) return PCACHE[id];
  const v = await S.get('suru:photo:'+id);
  if(v){ PCACHE[id]=v; return v; }
  return null;
}

/* ---------- helpers ---------- */
const trip    = () => DB.trips.find(t=>t.id===DB.activeTrip && !t.deleted) || null;
const cur     = () => CURRENCIES.find(c=>c.code===(trip()||{}).currency) || CURRENCIES[0];
const money   = n => cur().sym + fmt(n);
const thb     = n => '฿' + fmt(n * (trip()?.rate ?? cur().rate));
const live    = a => a.filter(x=>!x.deleted);
const cmpTime = (a,b) => String(a&&a.createdAt||'').localeCompare(String(b&&b.createdAt||''));
const num     = v => { const n = Number(v); return isFinite(n) ? n : 0; };  // กันค่าเสียเป็น NaN
const isEntry = e => e && typeof e.id==='string' && e.id.indexOf('bx_')!==0;  // กันกล่องปนในรายการซื้อ
const tEntries= () => live(DB.entries).filter(e=>isEntry(e) && e.tripId===DB.activeTrip);
const tGroups = () => live(DB.groups).filter(g=>g.tripId===DB.activeTrip);
const gEntries= gid => live(DB.entries).filter(e=>isEntry(e) && e.groupId===gid);
const tBoxes  = () => live(DB.boxes).filter(b=>b.tripId===DB.activeTrip);
const tCarriers = () => live(DB.carriers).filter(c=>c.tripId===DB.activeTrip);
const carrierById = id => DB.carriers.find(c=>c.id===id);
function carrierLabel(id){ const c=carrierById(id); if(!c) return ''; return c.name + (c.mode==='sea'?' · ทางเรือ':c.mode==='air'?' · ทางเครื่อง':''); }
async function addCarrier(name, mode){
  const c = touch({ id:uid('cr_'), tripId:DB.activeTrip, name:(name||'').trim(), mode:mode||'' });
  DB.carriers.push(c); await saveMeta(); syncNow(true); return c;
}
async function deleteCarrier(cid){
  const c=carrierById(cid); if(!c) return;
  c.deleted=1; touch(c);
  // กล่องที่ใช้เจ้านี้ ให้เคลียร์ออก
  tBoxes().forEach(b=>{ if(b.carrierId===cid){ b.carrierId=''; touch(b); } });
  await saveMeta(); render(); syncNow(true);
}
// จำนวนที่ซื้อมาจริงของสินค้าหนึ่งชนิด
const groupBought = gid => gEntries(gid).reduce((a,e)=>a+num(e.qty),0);
// จำนวนที่ถูกใส่กล่องไปแล้วทั้งหมดของสินค้าหนึ่งชนิด (ทุกกล่อง)
function groupPacked(gid, exceptBox){
  let n=0;
  tBoxes().forEach(b=>{ if(b.id===exceptBox) return; (b.items||[]).forEach(it=>{ if(it.groupId===gid) n+=num(it.qty); }); });
  return n;
}
// เหลือใส่กล่องได้อีกเท่าไร
const groupRemain = (gid, exceptBox) => Math.max(0, groupBought(gid) - groupPacked(gid, exceptBox));
const boxQty = b => (b.items||[]).reduce((a,it)=>a+num(it.qty),0);
const touch   = r => { r.updated = now(); r.dirty = 1; return r; };

const groupName = g => g.name || '';
function groupStats(g){
  const es = gEntries(g.id);
  const qty = es.reduce((a,e)=>a+num(e.qty),0);
  const sum = es.reduce((a,e)=>a+num(e.total),0);
  return { qty, sum, avg: qty?sum/qty:0, buys: es.length, es };
}
const gEntriesSorted = gid => gEntries(gid).slice().sort(cmpTime);
const thumbOf = g => (gEntriesSorted(g.id)[0]||{}).thumb || '';
function toast(m){
  const d=document.createElement('div'); d.className='toast'; d.textContent=m;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2200);
}

/* ---------- boot ---------- */
async function boot(){
  if(window.storage) BACKEND='claude';
  else if(window.indexedDB){ try{ await IDB.get('probe'); BACKEND='idb'; }catch(e){ BACKEND='memory'; } }
  memOnly = BACKEND==='memory';
  try{ if(navigator.storage?.persist) await navigator.storage.persist(); }catch(e){}

  if(!memOnly){ const m = await S.get('suru:meta'); if(m) DB = Object.assign(DB, m); }
  if(!Array.isArray(DB.carriers)) DB.carriers = [];
  // กล่องที่มีรูป inline (จากเวอร์ชันเก่า) ให้ push รูปแยก + sync ข้อมูลใหม่ทับตัวเสียบนเซิร์ฟเวอร์
  (DB.boxes||[]).forEach(b=>{ if(b.photo && !b.photoUp){ b.dirty=1; b.updated=now(); } });
  let fixed=false;
  // ล้างกล่อง (bx_) ที่หลงเข้ามาในลิสต์รายการซื้อ
  const badBx = (DB.entries||[]).filter(e=>e && typeof e.id==='string' && e.id.indexOf('bx_')===0);
  if(badBx.length){
    badBx.forEach(e=>{
      // ถ้ายังไม่มีในลิสต์กล่อง ให้ย้ายไปไว้ที่ถูก
      if(!DB.boxes.find(b=>b.id===e.id) && !e.deleted && Array.isArray(e.items)) DB.boxes.push(e);
    });
    DB.entries = DB.entries.filter(e=>!(e && typeof e.id==='string' && e.id.indexOf('bx_')===0));
    fixed=true;
  }
  // ซ่อมข้อมูลเก่าที่เพี้ยน (NaN / ไม่มีวันเวลา) จากเวอร์ชันก่อน
  (DB.entries||[]).forEach(e=>{
    const before = JSON.stringify([e.cost,e.qty,e.total,e.createdAt]);
    fixEntry(e);
    if(JSON.stringify([e.cost,e.qty,e.total,e.createdAt]) !== before){
      e.updated = now(); e.dirty = 1; fixed=true;   // ดันขึ้นเซิร์ฟเวอร์ทับตัวเสีย
    }
  });
  if(fixed){ await saveMeta(); }
  if(!DB.device){ DB.device = uid('dv_'); DB.deviceName = 'เครื่อง ' + DB.device.slice(-4); await saveMeta(); }
  await restoreDraft();
  render();
  if(memOnly) toast('เบราว์เซอร์นี้เก็บข้อมูลถาวรไม่ได้ ข้อมูลจะหายเมื่อปิดแท็บ');
  syncNow(true);
  setInterval(()=>{ if(document.visibilityState==='visible') syncNow(true); }, 15000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') syncNow(true); });
  window.addEventListener('online', ()=>syncNow(true));
}

/* =========================================================
   SYNC — เก็บลงเครื่องก่อน แล้วค่อยส่งขึ้นเซิร์ฟเวอร์
   ========================================================= */
async function api(path, body, timeoutMs){
  if(!DB.server) throw new Error('ยังไม่ได้ตั้งค่าเซิร์ฟเวอร์');
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs || 12000);
  try{
    const r = await fetch(DB.server + path, {
      method:'POST',
      headers:{'Content-Type':'application/json', 'X-App-Token': DB.token || ''},
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
    if(!r.ok) throw new Error('เซิร์ฟเวอร์ตอบ ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}
const wire = (kind, r) => {
  let rec = {...r};
  delete rec.dirty; delete rec.photoUp; delete rec.needPhoto;
  // รูปหน้ากล่องเก็บแยกทาง /photo ไม่ส่งใน /sync (กัน payload ใหญ่จน JSON ขาด)
  if(kind==='box'){ if(rec.photo){ rec.hasPhoto = 1; } delete rec.photo; }
  return {
    id:rec.id, kind, trip: kind==='trip'? rec.id : rec.tripId,
    updated:rec.updated||0, deleted:rec.deleted?1:0,
    data: JSON.stringify(rec)
  };
};
function dirtyRecords(tid){
  const out=[];
  DB.trips.filter(t=>t.id===tid && t.dirty).forEach(t=>out.push(wire('trip',t)));
  DB.carriers.filter(c=>c.tripId===tid && c.dirty).forEach(c=>out.push(wire('carrier',c)));
  DB.boxes.filter(b=>b.tripId===tid && b.dirty).forEach(b=>out.push(wire('box',b)));
  DB.groups.filter(g=>g.tripId===tid && g.dirty).forEach(g=>out.push(wire('group',g)));
  DB.entries.filter(e=>e.tripId===tid && e.dirty).forEach(e=>out.push(wire('entry',e)));
  return out;
}
function fixEntry(e){
  if(!e || typeof e!=='object') return e;
  const c=num(e.cost), q=num(e.qty);
  e.cost=c; e.qty=q;
  if(!isFinite(Number(e.total))) e.total=c*q; else e.total=num(e.total);
  // createdAt ต้องเป็น string ที่แปลงเป็นวันได้จริง ไม่งั้นแทนด้วยเวลาปัจจุบัน
  if(!e.createdAt || typeof e.createdAt!=='string' || isNaN(new Date(e.createdAt).getTime())){
    e.createdAt = new Date().toISOString();
  }
  return e;
}
function applyRemote(rec){
  // กันข้อมูลเสียบนเซิร์ฟเวอร์ (เช่น payload เก่าที่ขาด) ไม่ให้พังทั้ง sync
  let inc;
  try{ inc = JSON.parse(rec.data); }
  catch(e){ console.warn('ข้าม record เสีย', rec.id, e.message); return; }
  // เลือกลิสต์ตามชนิด แต่ถ้า id เป็น bx_ ให้ลง boxes เสมอ (กันกล่องหลงเข้า entries)
  let kind = rec.kind;
  if(inc && typeof inc.id==='string' && inc.id.indexOf('bx_')===0) kind='box';
  const list = kind==='trip'? DB.trips : kind==='group'? DB.groups : kind==='box'? DB.boxes : kind==='carrier'? DB.carriers : DB.entries;
  inc.updated = rec.updated; inc.deleted = rec.deleted; delete inc.dirty;
  if(kind==='entry') fixEntry(inc);
  const i = list.findIndex(x=>x.id===inc.id);
  if(kind==='box'){
    const prevPhoto = i>=0 ? list[i].photo : null;
    if(inc.hasPhoto && !inc.photo){ inc.photo = prevPhoto || ''; if(!prevPhoto) inc.needPhoto = 1; }
  }
  if(i<0){ list.push(inc); return; }
  if((list[i].updated||0) < rec.updated) list[i] = inc;
}
function setDot(){
  const d = document.getElementById('syncDot'); if(!d) return;
  const pending = DB.server ? dirtyRecords(DB.activeTrip).length : 0;
  d.className = 'dot ' + (!DB.server ? 'off' : pending ? 'wait' : 'on');
}
async function syncNow(silent){
  if(syncing || !DB.server || !DB.activeTrip) { setDot(); return; }
  syncing = true;
  try{
    const tid = DB.activeTrip;
    const changes = dirtyRecords(tid);
    const res = await api('/sync', { trip:tid, since: DB.sync[tid]||0, changes });
    (res.records||[]).forEach(applyRemote);
    changes.forEach(c=>{
      const l = [...DB.trips,...DB.groups,...DB.entries].find(x=>x.id===c.id);
      if(l && l.updated <= c.updated) delete l.dirty;
    });
    DB.sync[tid] = res.now;
    lastSyncOk = now();
    await saveMeta();
    if(composing()) setDot(); else render();
    pushPhotos();
    pullBoxPhotos();
    if(!silent) toast('ซิงก์แล้ว');
  }catch(e){
    if(!silent) toast('ซิงก์ไม่สำเร็จ: ' + e.message);
  }finally{ syncing=false; setDot(); }
}
async function pushPhotos(){
  if(!DB.server) return;
  // รูปสินค้า
  const pend = DB.entries.filter(e=>e.tripId===DB.activeTrip && !e.deleted && !e.photoUp).slice(0,3);
  for(const e of pend){
    const data = await getPhoto(e.id);
    if(!data){ e.photoUp = 1; continue; }
    try{ await api('/photo/put', {trip:e.tripId, id:e.id, data}); e.photoUp = 1; }
    catch(err){ break; }
  }
  // รูปหน้ากล่อง (เก็บ inline ใน b.photo — ส่งแยกทาง /photo)
  const boxPend = DB.boxes.filter(b=>b.tripId===DB.activeTrip && !b.deleted && b.photo && !b.photoUp).slice(0,2);
  for(const b of boxPend){
    try{ await api('/photo/put', {trip:b.tripId, id:b.id, data:b.photo}); b.photoUp = 1; }
    catch(err){ break; }
  }
  await saveMeta();
}
// ดึงรูปกล่องที่ยังไม่มีในเครื่อง
async function pullBoxPhotos(){
  if(!DB.server) return;
  const need = DB.boxes.filter(b=>b.tripId===DB.activeTrip && !b.deleted && b.needPhoto).slice(0,3);
  for(const b of need){
    try{
      const res = await api('/photo/get', {ids:[b.id]}, 8000);
      const data = (res.photos||{})[b.id];
      if(data){ b.photo = data; delete b.needPhoto; }
      else delete b.needPhoto;
    }catch(err){ break; }
  }
  await saveMeta();
}
async function pullPhotos(ids){
  const missing = [];
  for(const id of ids){ if(!(await getPhoto(id))) missing.push(id); }
  if(!missing.length || !DB.server) return missing.length;
  const deadline = Date.now() + 20000;   // ใช้เวลาดึงรูปรวมไม่เกิน 20 วินาที แล้วไปต่อ
  for(let i=0;i<missing.length;i+=4){
    if(Date.now() > deadline) break;
    try{
      const res = await api('/photo/get', {ids: missing.slice(i,i+4)}, 8000);
      for(const [id,data] of Object.entries(res.photos||{})) await putPhoto(id, data);
    }catch(e){ break; }
  }
  let still=0; for(const id of missing) if(!(await getPhoto(id))) still++;
  return still;
}

/* ---------- image ---------- */
const loadImg = src => new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=src; });
async function processPhoto(file){
  const url = URL.createObjectURL(file);
  const img = await loadImg(url);
  const draw = (max,q)=>{
    const s = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement('canvas');
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',q);
  };
  const full = draw(1000,.72), thumb = draw(150,.55);
  const c = document.createElement('canvas'); c.width=c.height=8;
  const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,8,8);
  const d=ctx.getImageData(0,0,8,8).data, g=[];
  for(let i=0;i<64;i++) g.push(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2]);
  const avg=g.reduce((a,b)=>a+b,0)/64;
  const hash=g.map(v=>v>avg?'1':'0').join('');
  URL.revokeObjectURL(url);
  let barcode='';
  try{ if('BarcodeDetector' in window){ const res = await new BarcodeDetector().detect(await loadImg(full));
    if(res && res[0]) barcode = res[0].rawValue||''; } }catch(e){}
  return {full, thumb, hash, barcode};
}
const hamming=(a,b)=>{ if(!a||!b||a.length!==b.length) return 64; let n=0; for(let i=0;i<a.length;i++) if(a[i]!==b[i])n++; return n; };

/* ---------- แนะนำสินค้าซ้ำ ---------- */
const norm = s => String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
function nameSim(a,b){
  a=norm(a); b=norm(b);
  if(!a||!b) return 0; if(a===b) return 1;
  const A=new Set(a.split(' ').filter(w=>w.length>1)), B=new Set(b.split(' ').filter(w=>w.length>1));
  if(!A.size||!B.size) return 0;
  let hit=0; A.forEach(w=>{ if(B.has(w)) hit++; });
  return hit/Math.min(A.size,B.size);
}
function pairScore(g1,g2){
  const e1=gEntries(g1.id), e2=gEntries(g2.id);
  const b1=e1.map(e=>e.barcode).filter(Boolean), b2=e2.map(e=>e.barcode).filter(Boolean);
  if(b1.some(b=>b2.includes(b))) return {score:.99, why:'บาร์โค้ดตรงกัน'};
  let img=0; e1.forEach(a=>e2.forEach(b=>{ img=Math.max(img,1-hamming(a.hash,b.hash)/64); }));
  const nm = nameSim(groupName(g1), groupName(g2));
  return { score: Math.max(nm*.65+img*.35, img>=.92?.8:0),
           why: nm>.6?'ชื่อสินค้าใกล้เคียง' : img>=.9?'รูปสินค้าคล้ายกันมาก' : 'ชื่อและรูปใกล้เคียง' };
}
function suggestions(){
  const gs=tGroups(), out=[];
  for(let i=0;i<gs.length;i++) for(let j=i+1;j<gs.length;j++){
    const a=gs[i], b=gs[j];
    if((a.skip||[]).includes(b.id)||(b.skip||[]).includes(a.id)) continue;
    const {score,why}=pairScore(a,b);
    if(score>=.62) out.push({a,b,score,why});
  }
  return out.sort((x,y)=>y.score-x.score).slice(0,4);
}

// หลังลบหรือลดจำนวนสินค้า ให้จำนวนในกล่องไม่เกินที่มีจริง ส่วนเกินถูกตัดออก
async function reconcileBoxes(){
  let changed=false, trimmed=false;
  tBoxes().forEach(b=>{
    const items=[];
    (b.items||[]).forEach(it=>{
      const bought = groupBought(it.groupId);
      if(bought<=0){ trimmed=true; changed=true; return; }        // สินค้าถูกลบหมด
      // จำกัดไม่ให้รวมทุกกล่องเกินที่ซื้อ โดยไล่ตามลำดับกล่อง
      items.push(it);
    });
    if(items.length!==(b.items||[]).length){ b.items=items; touch(b); }
  });
  // ไล่ตัดส่วนที่รวมเกินทีละสินค้า
  tGroups().forEach(g=>{
    let over = groupPacked(g.id) - groupBought(g.id);
    if(over<=0) return;
    changed=true; trimmed=true;
    tBoxes().slice().reverse().forEach(b=>{               // ตัดจากกล่องหลังก่อน
      if(over<=0) return;
      const it=(b.items||[]).find(x=>x.groupId===g.id);
      if(!it) return;
      const cut=Math.min(it.qty, over); it.qty-=cut; over-=cut;
      if(it.qty<=0) b.items=b.items.filter(x=>x!==it);
      touch(b);
    });
  });
  if(changed){ await saveMeta(); }
  if(trimmed) toast('ปรับจำนวนในกล่องให้ตรงกับของที่มีแล้ว');
  return changed;
}

async function mergeGroups(aId,bId){

  DB.entries.forEach(e=>{ if(e.groupId===b.id){ e.groupId=a.id; touch(e); } });

async function skipPair(aId,bId){

    + '<button class="save" style="background:linear-gradient(135deg,#F87171,#DC2626);box-shadow:0 4px 0 #991B1B" onclick="doDeleteCarrier(\'' + cid + '\',\'' + bid + '\')">ลบขนส่ง</button>'
    + '<button class="ghost" onclick="pickCarrier(\'' + bid + '\')">ยกเลิก</button>');
}
async function doDeleteCarrier(cid, bid){ await deleteCarrier(cid); pickCarrier(bid); toast('ลบขนส่งแล้ว'); }
// แก้ไขขนส่ง
let _editMode='';
function editCarrier(cid, bid){
  const c=carrierById(cid); if(!c) return;
  _editMode = c.mode||'';
  shell('<h3>แก้ไขขนส่ง</h3><p class="sub">เปลี่ยนชื่อ หรือทาง เรือ/เครื่อง</p>'
    + '<div class="field"><label>ชื่อขนส่ง</label>'
    + '<input class="tin" id="editcarrier" value="' + esc(c.name) + '"></div>'
    + '<div class="field"><label>ส่งทาง</label>'
    + '<div class="modeseg"><button class="segbtn' + (c.mode==='sea'?' on':'') + '" id="emode-sea" onclick="pickEditMode(\'sea\')">ทางเรือ</button>'
    + '<button class="segbtn' + (c.mode==='air'?' on':'') + '" id="emode-air" onclick="pickEditMode(\'air\')">ทางเครื่อง</button>'
    + '<button class="segbtn' + (!c.mode?' on':'') + '" id="emode-none" onclick="pickEditMode(\'\')">ไม่ระบุ</button></div></div>'
    + '<button class="go" onclick="saveCarrierEdit(\'' + cid + '\',\'' + bid + '\')">บันทึก</button>'

function pickEditMode(m){ _editMode=m; ['sea','air','none'].forEach(k=>{ const el=document.getElementById('emode-'+k); if(el) el.classList.toggle('on', (k==='none'?'':k)===m); }); }
async function saveCarrierEdit(cid, bid){
  const c=carrierById(cid); if(!c) return;
  const name=(document.getElementById('editcarrier').value||'').trim();
  if(!name){ toast('ใส่ชื่อขนส่งก่อน'); return; }
  c.name=name; c.mode=_editMode; touch(c); _editMode='';
  await saveMeta(); syncNow(true); pickCarrier(bid); toast('บันทึกแล้ว');
}

async function openBox(bid){
  const b = DB.boxes.find(x=>x.id===bid); if(!b) return;
  const idx = tBoxes().indexOf(b);
  const items = (b.items||[]);
  const rows = items.map(it=>{
    const g = DB.groups.find(x=>x.id===it.groupId);
    const nm = g? (groupName(g) || 'สินค้าไม่มีชื่อ') : 'สินค้าถูกลบแล้ว';
    return '<div class="buyrow"><div style="display:flex;gap:10px;align-items:center;flex:1;min-width:0">'
      + '<img src="' + (g?thumbOf(g):'') + '" style="width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--pop-soft);flex:none">'
      + '<div style="min-width:0"><div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(nm) + '</div>'
      + '<div class="who">ในกล่องนี้ ' + it.qty + ' ชิ้น</div></div></div>'
      + '<button class="pill" onclick="editBoxItem(\'' + bid + '\',\'' + it.groupId + '\')">แก้จำนวน</button></div>';
  }).join('') || '<div class="hint" style="text-align:left">ยังไม่มีสินค้าในกล่องนี้ กดปุ่มด้านล่างเพื่อเลือกใส่</div>';
  shell('<h3>' + esc(b.name || ('กล่อง ' + (idx+1))) + '</h3>'
    + '<p class="sub">ในกล่องนี้ ' + boxQty(b) + ' ชิ้น · ' + new Set(items.map(i=>i.groupId)).size + ' ชนิด</p>'
    + '<div class="field"><label>ชื่อกล่อง</label>'
      + '<input class="tin" id="bxname" value="' + esc(b.name) + '" placeholder="เช่น กล่อง 1 หรือ ของแตกง่าย"></div>'
    + '<div class="field"><label>ส่งกับขนส่ง</label>'
      + '<button class="carrierpick" onclick="stashThenPickCarrier(\'' + bid + '\')">'
      + (b.carrierId && carrierById(b.carrierId)
          ? '<span class="cpick-on">' + carrierChip(b.carrierId) + '</span>'
          : '<span class="cpick-none">เลือกขนส่ง (หรือเว้นว่างไว้ก็ได้)</span>')
      + '<span class="cpick-arrow">›</span></button></div>'
    + '<div class="sectionhead"><h2>รูปหน้ากล่อง / ใบจ่าหน้า</h2></div>'
    + (b.photo
        ? '<div class="bphoto-wrap"><div class="bphoto"><img src="' + b.photo + '" alt="รูปหน้ากล่อง">'
          + '<div class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h2.5l1.2-1.8a1 1 0 0 1 .84-.45h6.92a1 1 0 0 1 .84.45L17.5 8H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>'
          + '<span>รูปนี้จะอยู่ในใบลงกล่อง PDF ด้วย</span>'
          + '<button class="re" onclick="shootBox(\'' + bid + '\')">เปลี่ยน</button></div></div></div>'
        : '<div class="bphoto-wrap"><button class="addbphoto" onclick="shootBox(\'' + bid + '\')">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h2.5l1.2-1.8a1 1 0 0 1 .84-.45h6.92a1 1 0 0 1 .84.45L17.5 8H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>'
          + '<div class="t">＋ เพิ่มรูปหน้ากล่อง</div><div class="s">ถ่ายเลขกล่องหรือใบจ่าหน้า</div></button></div>')
    + '<div class="sectionhead"><h2>สินค้าในกล่อง</h2></div>' + rows
    + '<button class="save" style="margin-top:12px" onclick="stashBoxNameThenPick(\'' + bid + '\')">＋ เลือกสินค้าใส่กล่อง</button>'
    + '<button class="go" onclick="saveBoxName(\'' + bid + '\')">บันทึกชื่อกล่อง</button>'
    + '<button class="ghost danger" onclick="confirmDeleteBox(\'' + bid + '\')">ลบกล่องนี้</button>'
    + '<button class="ghost" onclick="closeBoxEditor(\'' + bid + '\')">ปิด</button>');
}
// ปิดหน้าแก้กล่อง: เก็บชื่อที่พิมพ์ค้าง แล้วถ้ากล่องว่างเปล่าให้ลบทิ้ง กันกล่องมั่ว
async function closeBoxEditor(bid){
  const b=DB.boxes.find(x=>x.id===bid);
  if(b){
    const el=document.getElementById('bxname');
    if(el){ const nm=el.value.trim(); if(nm!==(b.name||'')){ b.name=nm; touch(b); } }
    const empty = !(b.name||'').trim() && !(b.items||[]).length && !b.photo && !b.carrierId;
    if(empty){ b.deleted=1; touch(b); await saveMeta(); syncNow(true); }
    else { await saveMeta(); syncNow(true); }
  }
  closeModal(); render();
}

async function saveBoxName(bid){
  const b=DB.boxes.find(x=>x.id===bid);
  b.name=document.getElementById('bxname').value.trim(); touch(b);
  await saveMeta(); closeModal(); render(); syncNow(true); toast('บันทึกกล่องแล้ว');
}
function confirmDeleteBox(bid){
  const b=DB.boxes.find(x=>x.id===bid);
  shell('<h3>ลบกล่องนี้</h3><p class="sub">สินค้าในกล่องจะถูกปล่อยกลับไปเป็น “ยังไม่ลงกล่อง” ไม่ได้ลบออกจากรายการซื้อ</p>'
    + '<button class="go" style="background:var(--pop)" onclick="deleteBox(\'' + bid + '\')">ยืนยันลบกล่อง</button>'
    + '<button class="ghost" onclick="openBox(\'' + bid + '\')">ยกเลิก</button>');
}
async function deleteBox(bid){
  const b=DB.boxes.find(x=>x.id===bid); if(!b) return;
  b.deleted=1; touch(b);
  await saveMeta(); closeModal(); render(); syncNow(true); toast('ลบกล่องแล้ว');
}

// เลือกสินค้าจากรายการช้อปปิ้งมาใส่กล่อง
// เก็บชื่อกล่องที่พิมพ์ค้างไว้ก่อน แล้วค่อยเปิดหน้าเลือกสินค้า (กันชื่อหาย)
async function stashBoxNameThenPick(bid){
  const el = document.getElementById('bxname');
  if(el){
    const b = DB.boxes.find(x=>x.id===bid);
    if(b){ const nm = el.value.trim(); if(nm !== (b.name||'')){ b.name = nm; touch(b); await saveMeta(); syncNow(true); } }
  }
  pickForBox(bid);
}
function pickForBox(bid){
  const bnow = DB.boxes.find(x=>x.id===bid);
  const trueRemain = g => Math.max(0, groupBought(g.id) - groupPacked(g.id));  // ยังไม่ลงกล่องไหนเลย
  const gs = tGroups().filter(g=>trueRemain(g) > 0 || (bnow.items||[]).some(it=>it.groupId===g.id));
  if(!gs.length){ shell('<h3>เลือกสินค้าใส่กล่อง</h3><p class="sub">สินค้าทุกชิ้นถูกจัดลงกล่องครบแล้ว</p><button class="ghost" onclick="openBox(\'' + bid + '\')">กลับ</button>'); return; }
  const list = gs.map(g=>{
    const remain = trueRemain(g);
    const inThis = ((bnow.items||[]).find(it=>it.groupId===g.id)||{}).qty || 0;
    return '<div class="pickcard">'
      + '<button class="pickmain" onclick="addToBox(\'' + bid + '\',\'' + g.id + '\')">'
      + '<img class="th" src="' + thumbOf(g) + '">'
      + '<div class="body"><div class="nm">' + esc(groupName(g) || 'สินค้าไม่มีชื่อ') + '</div>'
      + '<div class="meta">เหลือใส่ได้ ' + remain + ' ชิ้น' + (inThis? ' · อยู่ในกล่องนี้แล้ว ' + inThis : '') + '</div></div></button>'
      + (remain>0 ? '<button class="allbtn" onclick="addAllToBox(\'' + bid + '\',\'' + g.id + '\')">＋ ทั้งหมด ' + remain + '</button>' : '')
      + '</div>';
  }).join('');
  shell('<h3>เลือกสินค้าใส่กล่อง</h3><p class="sub">แตะที่สินค้าเพื่อใส่จำนวนเอง หรือกดปุ่มชมพู “ทั้งหมด” เพื่อใส่จำนวนที่เหลือรวดเดียว</p>'
    + list + '<button class="ghost" onclick="openBox(\'' + bid + '\')">กลับ</button>');
}

function addToBox(bid, gid){
  const b=DB.boxes.find(x=>x.id===bid);
  const remain = groupRemain(gid, bid);
  const cur = (b.items||[]).find(it=>it.groupId===gid);
  // เริ่มด้วยค่าว่าง ถ้ายังไม่เคยใส่ / ถ้าเคยใส่แล้วโชว์ค่าเดิม
  qtyDialog(bid, gid, cur ? cur.qty : '', remain);
}
// ใส่จำนวนที่เหลือทั้งหมดรวดเดียว
async function addAllToBox(bid, gid){
  // ที่เหลือจริง = ซื้อมา − ที่ลงกล่องไปแล้วทุกกล่อง (รวมกล่องนี้ด้วย)
  const remainAll = Math.max(0, groupBought(gid) - groupPacked(gid));
  if(remainAll<=0){ toast('สินค้านี้ลงกล่องครบแล้ว'); return; }
  const b=DB.boxes.find(x=>x.id===bid);
  const cur=(b.items||[]).find(it=>it.groupId===gid);
  const add = (cur?cur.qty:0) + remainAll;   // ของเดิมในกล่องนี้ + ที่ยังเหลือ
  b.items=(b.items||[]).filter(it=>it.groupId!==gid);
  b.items.push({groupId:gid, qty:add});
  touch(b);
  await saveMeta(); render(); syncNow(true); pickForBox(bid);
  toast('ใส่ทั้งหมด ' + remainAll + ' ชิ้นลงกล่องแล้ว');
}
function editBoxItem(bid, gid){
  const b=DB.boxes.find(x=>x.id===bid);
  const cur=(b.items||[]).find(it=>it.groupId===gid);
  qtyDialog(bid, gid, cur?cur.qty:'', groupRemain(gid, bid));
}
function qtyDialog(bid, gid, val, remain){
  const g=DB.groups.find(x=>x.id===gid);
  shell('<h3>' + esc(groupName(g) || 'สินค้าไม่มีชื่อ') + '</h3>'
    + '<p class="sub">เหลือใส่ได้สูงสุด ' + remain + ' ชิ้น (ซื้อมา ' + groupBought(gid) + ' ลงกล่องอื่นแล้ว ' + groupPacked(gid, bid) + ')</p>'
    + '<img src="' + thumbOf(g) + '" style="width:100%;max-height:30vh;object-fit:contain;background:var(--pop-soft);border-radius:14px" alt="">'
    + '<div class="field"><label>จำนวนที่ใส่กล่องนี้</label>'
      + '<div class="stepper"><button onclick="bxBump(-1,' + remain + ')" aria-label="ลด">−</button>'
      + '<input id="bxq" inputmode="numeric" placeholder="0" value="' + val + '" oninput="bxClamp(' + remain + ')">'
      + '<button onclick="bxBump(1,' + remain + ')" aria-label="เพิ่ม">＋</button></div>'
      + '<div class="hint" id="bxwarn" style="text-align:left"></div></div>'
    + '<button class="go" onclick="submitBoxItem(\'' + bid + '\',\'' + gid + '\',' + remain + ')">ใส่ลงกล่อง</button>'
    + ((DB.boxes.find(x=>x.id===bid).items||[]).some(it=>it.groupId===gid)
        ? '<button class="ghost danger" onclick="removeBoxItem(\'' + bid + '\',\'' + gid + '\')">เอาออกจากกล่อง</button>' : '')
    + '<button class="ghost" onclick="pickForBox(\'' + bid + '\')">กลับ</button>');
}
function bxBump(d, max){ const q=document.getElementById('bxq'); q.value=Math.max(0,Math.min(max,(parseInt(q.value)||0)+d)); bxClamp(max); }
function bxClamp(max){
  const q=document.getElementById('bxq'); let v=parseInt(q.value)||0;
  const w=document.getElementById('bxwarn');
  if(v>max){ v=max; q.value=max; w.textContent='ใส่ได้มากสุด ' + max + ' ชิ้น ตามจำนวนที่ซื้อมา'; w.style.color='var(--pop)'; }
  else { w.textContent=''; }
}
async function submitBoxItem(bid, gid, remain){
  let q=parseInt(document.getElementById('bxq').value)||0;
  if(q>remain) q=remain;
  const b=DB.boxes.find(x=>x.id===bid);
  b.items=(b.items||[]).filter(it=>it.groupId!==gid);
  if(q>0) b.items.push({groupId:gid, qty:q});
  touch(b);
  await saveMeta(); render(); syncNow(true); openBox(bid);
  toast(q>0 ? 'ใส่ ' + q + ' ชิ้นลงกล่องแล้ว' : 'เอาออกจากกล่องแล้ว');
}
async function removeBoxItem(bid, gid){
  const b=DB.boxes.find(x=>x.id===bid);
  b.items=(b.items||[]).filter(it=>it.groupId!==gid); touch(b);
  await saveMeta(); render(); syncNow(true); openBox(bid); toast('เอาออกจากกล่องแล้ว');
}

// UI เลือกขนส่งในหน้าส่งออกใบลงกล่อง
function packingCarrierUI(boxes){
  const cs = tCarriers();
  // จับกลุ่มกล่องตามขนส่ง
  const used = cs.filter(c=>boxes.some(b=>b.carrierId===c.id));
  const noneBoxes = boxes.filter(b=>!b.carrierId || !carrierById(b.carrierId));
  if(!used.length){
    // ยังไม่มีใครตั้งขนส่ง — ปุ่มเดียวออกรวม
    return '<div class="ameta">แยกหน้าใหม่ทุกกล่อง มีรูปสินค้าและจำนวนในกล่องนั้น ' + boxes.length + ' กล่อง — สำหรับยื่นชิปปิ้ง<br>ตั้งขนส่งให้กล่องในแท็บ “กล่อง” เพื่อแยกใบตามเจ้าได้</div>'
      + '<button class="save" onclick="makePDF(\'packing\',this)">สร้างใบลงกล่อง</button>';
  }
  let html = '<div class="ameta">เลือกออกเฉพาะขนส่งเจ้าไหน หรือรวมทุกกล่อง</div><div class="expfilter">';
  used.forEach(c=>{
    const n = boxes.filter(b=>b.carrierId===c.id).length;
    const ic = c.mode==='sea'?'<span class="ci sea">เรือ</span>':c.mode==='air'?'<span class="ci air">บ.</span>':'<span class="ci all">▦</span>';
    html += '<button class="cbtn" onclick="makePDF(\'packing\',this,\'' + c.id + '\')">' + ic
      + '<span class="cnm">' + esc(carrierLabel(c.id)) + '</span><span class="cmeta">' + n + ' กล่อง</span><span class="cgo">›</span></button>';
  });
  if(noneBoxes.length){
    html += '<button class="cbtn" onclick="makePDF(\'packing\',this,\'__none__\')"><span class="ci all" style="background:#9B8AA3">?</span>'
      + '<span class="cnm">ยังไม่ระบุขนส่ง</span><span class="cmeta">' + noneBoxes.length + ' กล่อง</span><span class="cgo">›</span></button>';
  }
  html += '<div class="expdiv">— หรือ —</div>';
  html += '<button class="cbtn" onclick="makePDF(\'packing\',this)"><span class="ci all">▦</span><span class="cnm">ออกรวมทุกกล่อง</span><span class="cmeta">' + boxes.length + ' กล่อง</span><span class="cgo">›</span></button>';
  html += '</div>';
  return html;
}

      + '<div class="ah"><div class="aic">▤</div><div class="at">ใบตรวจรับสินค้า</div></div>'

            + '<button class="save" style="background:var(--ink2);box-shadow:none" onclick="tab=\'box\';render()">ไปหน้าจัดกล่อง</button>')

        ? '<div class="acard c3"><div class="ah"><div class="aic">⎘</div><div class="at">ทั้งสองแบบในไฟล์เดียว</div></div>'
          + '<div class="ameta">ใบตรวจรับตามด้วยใบลงกล่อง รวมในไฟล์ PDF เดียว สะดวกเวลาส่งต่อ</div>'
          + '<button class="save" style="background:var(--plum);box-shadow:0 3px 0 #7C3AED" onclick="makePDF(\'both\',this)">สร้างทั้งสองแบบ</button></div>'
        : '')
    + '<div class="hint">ถ้าซิงก์กับเซิร์ฟเวอร์ ระบบจะดึงรูปจากเครื่องอื่นมาให้ครบก่อนสร้างไฟล์</div></div>';

let boxPhotoTarget = null;
function shootBox(bid){
  // เก็บชื่อที่พิมพ์ค้างไว้ก่อน กันหายตอน render ใหม่หลังถ่ายรูป

  boxPhotoTarget = bid; document.getElementById('boxcam').click();

async function processBoxPhoto(file){
  const url = URL.createObjectURL(file);
  const img = await loadImg(url);
  const s = Math.min(1, 900/Math.max(img.width,img.height));
  const c = document.createElement('canvas');
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',.7);
}

function download(name, blob){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(u); },1000);
}

  download(`SURU_backup_${(trip()?.name||'all').replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.json`,
    new Blob([JSON.stringify({app:'SURU', v:2, savedAt:new Date().toISOString(), db:DB, photos})],{type:'application/json'}));

async function restoreJSON(file){
  try{
    const j = JSON.parse(await file.text());
    if(!j.db) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
    let added=0;
    for(const key of ['trips','groups','entries']){
      (j.db[key]||[]).forEach(inc=>{
        const i = DB[key].findIndex(x=>x.id===inc.id);
        if(i<0){ DB[key].push(inc); added++; }
        else if((inc.updated||0) > (DB[key][i].updated||0)) DB[key][i]=inc;
      });
    }
    for(const [id,data] of Object.entries(j.photos||{})) await putPhoto(id,data);
    if(!trip() && j.db.activeTrip) DB.activeTrip = j.db.activeTrip;
    await saveMeta(); closeModal(); render(); syncNow(true);
    toast(`กู้คืนแล้ว เพิ่มใหม่ ${added} รายการ`);
  }catch(e){ toast('กู้คืนไม่สำเร็จ: ' + e.message); }
}

const chunkArr=(a,n)=>{ const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
const pic = id => PCACHE[id] || '';

function dayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayLabel(d){ return d.toLocaleDateString('th-TH',{weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
const ROWS_PER_PAGE = 5;

// ===== ใบรายการสินค้า (รับของ) =====
function buildDetail(){
  const es = tEntries().filter(e=>num(e.qty)>0 || num(e.cost)>0).slice().sort(cmpTime);
  const days = [];
  es.forEach(e=>{
    const d = new Date(e.createdAt), k = dayKey(d);
    let g = days.find(x=>x.k===k);
    if(!g){ g = {k, label: dayLabel(d), items:[]}; days.push(g); }
    g.items.push(e);
  });
  const sheets = [];
  days.forEach(g=>{
    const parts = chunkArr(g.items, ROWS_PER_PAGE);
    parts.forEach((rows,i)=> sheets.push({g, rows, first:i===0, last:i===parts.length-1, part:i+1, parts:parts.length}));
  });
  const kinds = tGroups().length;
  const gQty = es.reduce((a,e)=>a+num(e.qty),0);
  const gSum = es.reduce((a,e)=>a+num(e.total),0);

  return sheets.map((sh,si)=>{
    let n = sh.rows.length ? sh.g.items.indexOf(sh.rows[0]) : 0;
    const rows = sh.rows.map(e=>{
      n++;
      const g = DB.groups.find(x=>x.id===e.groupId);
      const note = g && g.note ? esc(g.note) : '';
      return '<tr>'
        + '<td>' + n + '</td>'
        + '<td class="photo"><img src="' + (pic(e.id)||e.thumb) + '"></td>'
        + '<td class="cost">' + money(e.cost) + '</td>'
        + '<td><span class="q">' + e.qty + '</span></td>'
        + '<td class="tot">' + money(e.total) + '</td>'
        + (note ? '<td class="l">' + note + '</td>' : '<td class="blank"></td>')
        + '</tr>';
    }).join('');
    const dQty = sh.g.items.reduce((a,e)=>a+num(e.qty),0);
    const dSum = sh.g.items.reduce((a,e)=>a+num(e.total),0);
    const summary = sh.first
      ? '<div class="dsum">'
        + '<div class="dsc"><u>สินค้าทั้งหมด</u><b>' + kinds + ' รายการ</b></div>'
        + '<div class="dsc"><u>จำนวนรวม</u><b>' + gQty + ' ชิ้น</b></div>'
        + '<div class="dsc"><u>ยอดรวมทั้งสิ้น</u><b>' + money(gSum) + '</b></div></div>'
      : '';
    return '<div class="page">'
      + dhead('ใบรายการสินค้า')
      + summary
      + '<div class="dgrp"><div class="gl">' + esc(sh.g.label)
        + '<span>' + sh.g.items.length + ' รายการ · ' + dQty + ' ชิ้น'
        + (sh.parts>1 ? ' · หน้า ' + sh.part + '/' + sh.parts : '') + '</span></div>'
        + '<div class="gr">ยอดรวมวันนี้<b>' + money(dSum) + '</b></div></div>'
      + '<table class="pt"><colgroup>'
        + '<col style="width:44px"><col style="width:150px"><col style="width:120px"><col style="width:90px"><col style="width:130px"><col></colgroup>'
      + '<tr><th>#</th><th>รูปสินค้า</th><th>ต้นทุน/ชิ้น</th><th>จำนวน</th><th>ยอดรวม</th><th>บันทึก</th></tr>'
      + rows + '</table>'
      + dfoot(si+1, sheets.length)
      + '</div>';
  }).join('');
}

// ===== ใบลงกล่อง: หน้าสรุป + หน้าแต่ละกล่อง =====
function boxesForFilter(carrierFilter){
  let boxes = tBoxes().filter(b=>boxQty(b)>0);
  if(carrierFilter==='__none__') return boxes.filter(b=>!b.carrierId || !carrierById(b.carrierId));
  if(carrierFilter) return boxes.filter(b=>b.carrierId===carrierFilter);
  return boxes;
}
function buildPackingList(carrierFilter){
  const boxes = boxesForFilter(carrierFilter);
  if(!boxes.length) return '';
  const kinds = new Set();
  boxes.forEach(b=>(b.items||[]).forEach(it=>kinds.add(it.groupId)));
  const totalQty = boxes.reduce((a,b)=>a+boxQty(b),0);
  const nameOf = gid => { const g=DB.groups.find(x=>x.id===gid); return g?(groupName(g)||'สินค้าไม่มีชื่อ'):'(สินค้าถูกลบ)'; };
  // แถบขนส่งบนหัวใบ (ถ้ากรองเจ้าเดียว)
  const cid = (carrierFilter && carrierFilter!=='__none__') ? carrierFilter : '';
  const cObj = cid ? carrierById(cid) : null;
  const carrierBar = cObj
    ? '<div class="dcarrier"><div class="cig ' + (cObj.mode||'all') + '">' + (cObj.mode==='sea'?'เรือ':cObj.mode==='air'?'บ.':'▦') + '</div>'
      + '<div class="cinfo"><div class="ct">' + esc(cObj.name) + '</div>' + (cObj.mode==='sea'?'<div class="cs">ทางเรือ</div>':cObj.mode==='air'?'<div class="cs">ทางเครื่อง</div>':'') + '</div>'
      + '<div class="cq">กล่องในรอบนี้<b>' + boxes.length + ' กล่อง</b></div></div>'
    : (carrierFilter==='__none__'
        ? '<div class="dcarrier none"><div class="cinfo"><div class="ct">กล่องที่ยังไม่ระบุขนส่ง</div></div><div class="cq">รวม<b>' + boxes.length + ' กล่อง</b></div></div>'
        : '');

  // ---- หน้าสรุป (อาจมีหลายหน้าถ้ากล่องเยอะ) ----
  const BLOCKS_PER = 5;
  const boxNamed = boxes.map((b,i)=>({b, label: b.name || ('กล่อง ' + (i+1))}));
  const sumPages = chunkArr(boxNamed, BLOCKS_PER);

  // ---- หน้ารายละเอียดแต่ละกล่อง ----
  const PER = 6;
  const detailSheets = [];
  boxNamed.forEach(({b,label})=>{
    const parts = chunkArr(b.items||[], PER);
    (parts.length?parts:[[]]).forEach((items,pi)=> detailSheets.push({b, label, items, part:pi+1, parts:parts.length||1, last:pi===((parts.length||1)-1)}));
  });

  const totalPages = sumPages.length + detailSheets.length;
  let pageNo = 0;
  const out = [];

  // สรุป
  sumPages.forEach((grp,gi)=>{
    pageNo++;
    const blocks = grp.map(({b,label})=>{
      const items = (b.items||[]).map(it=>
        '<div class="bxi"><span class="bin">' + esc(nameOf(it.groupId)) + '</span><span class="biq">' + it.qty + '</span></div>').join('');
      const kn = new Set((b.items||[]).map(i=>i.groupId)).size;
      return '<div class="bxblock"><div class="bxh"><span class="bn">' + esc(label) + '</span>'
        + '<span class="bq">' + kn + ' ชนิด · ' + boxQty(b) + ' ชิ้น</span></div>' + items + '</div>';
    }).join('');
    out.push('<div class="page">'
      + dhead('ใบลงกล่อง')
      + (gi===0 ? carrierBar + '<div class="dsum">'
          + '<div class="dsc"><u>จำนวนกล่อง</u><b>' + boxes.length + ' กล่อง</b></div>'
          + '<div class="dsc"><u>สินค้าทั้งหมด</u><b>' + kinds.size + ' รายการ</b></div>'
          + '<div class="dsc"><u>จำนวนรวม</u><b>' + totalQty + ' ชิ้น</b></div></div>' : '')
      + '<div class="dsec">รายการแต่ละกล่อง</div>'
      + blocks
      + dfoot(pageNo, totalPages) + '</div>');
  });

  // รายละเอียดกล่อง
  detailSheets.forEach(sh=>{
    pageNo++;
    let n = sh.items.length ? (sh.b.items||[]).indexOf(sh.items[0]) : 0;
    const rows = sh.items.map(it=>{
      n++;
      const g = DB.groups.find(x=>x.id===it.groupId);
      return '<tr>'
        + '<td>' + n + '</td>'
        + '<td class="photo"><img src="' + (g?(pic((gEntriesSorted(g.id)[0]||{}).id)||thumbOf(g)):'') + '"></td>'
        + '<td class="l"><span class="nm">' + esc(nameOf(it.groupId)) + '</span></td>'
        + '<td><span class="q">' + it.qty + '</span></td>'
        + '<td><div class="chk"></div></td></tr>';
    }).join('');
    const kn = new Set((sh.b.items||[]).map(i=>i.groupId)).size;
    const boxPhoto = (sh.first!==false && sh.part===1 && sh.b.photo)
      ? '<div class="bxphoto"><img src="' + sh.b.photo + '"><div class="bxphoto-cap"><b>รูปหน้ากล่อง / ใบจ่าหน้า</b>ถ่ายไว้ให้รู้ว่าสินค้ามาจากกล่องไหน</div></div>'
      : '';
    out.push('<div class="page">'
      + dhead('ใบลงกล่อง')
      + '<div class="dgrp"><div class="gl">' + esc(sh.label)
        + '<span>' + kn + ' ชนิด' + (sh.parts>1?' · หน้า '+sh.part+'/'+sh.parts:'') + '</span></div>'
        + '<div class="gr">รวมในกล่อง<b>' + boxQty(sh.b) + ' ชิ้น</b></div></div>'
      + boxPhoto
      + '<table class="pt"><colgroup>'
        + '<col style="width:44px"><col style="width:150px"><col><col style="width:90px"><col style="width:70px"></colgroup>'
      + '<tr><th>#</th><th>รูปสินค้า</th><th>ชื่อสินค้า</th><th>จำนวน</th><th>เช็ค</th></tr>'
      + rows + '</table>'
      + dfoot(pageNo, totalPages) + '</div>');
  });

  return out.join('');
}

async function makePDF(kind, btn, carrierFilter){
  const label=btn.textContent; btn.disabled=true;
  btn.textContent='กำลังเตรียมรูป…';
  const stage=document.getElementById('stage');
  try{
    let ids = [];
    if(kind!=='packing') ids = ids.concat(tEntries().map(e=>e.id));
    if(kind!=='receiving') boxesForFilter(carrierFilter).forEach(b=>(b.items||[]).forEach(it=>{ const e=gEntries(it.groupId)[0]; if(e) ids.push(e.id); }));
    let missing = 0;
    try{ missing = await pullPhotos([...new Set(ids)]); }catch(e){ missing = 0; }
    if(missing) toast('ขาดรูป ' + missing + ' ใบ จะใช้รูปย่อแทน');

    btn.textContent='กำลังสร้าง PDF…';
    const parts=[];
    if(kind!=='packing')   parts.push(buildDetail());
    if(kind!=='receiving') parts.push(buildPackingList(carrierFilter));
    stage.innerHTML = parts.filter(Boolean).join('');
    if(!stage.innerHTML){ toast('ยังไม่มีข้อมูลให้ออก'); stage.innerHTML=''; btn.textContent=label; btn.disabled=false; return; }

    // กันรูปเสีย: รูปใบไหนโหลดไม่ขึ้น ให้ซ่อนไว้ ไม่ให้ html2canvas ค้างหรือพัง
    await new Promise(r=>setTimeout(r,120));
    await Promise.all([...stage.querySelectorAll('img')].map(img=>new Promise(res=>{
      if(img.complete && img.naturalWidth>0) return res();
      const done=()=>res();
      const timer=setTimeout(()=>{ img.style.visibility='hidden'; res(); }, 4000);
      img.onload=()=>{ clearTimeout(timer); done(); };
      img.onerror=()=>{ clearTimeout(timer); img.style.visibility='hidden'; done(); };
      if(!img.getAttribute('src')){ clearTimeout(timer); img.style.visibility='hidden'; res(); }
    })));

    if(!window.html2canvas || !window.jspdf){ throw new Error('โหลดตัวสร้าง PDF ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่'); }
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4'});
    const pages=[...stage.querySelectorAll('.page')];
    for(let i=0;i<pages.length;i++){
      const cv = await html2canvas(pages[i],{scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false, imageTimeout:5000});
      if(i) pdf.addPage();
      pdf.addImage(cv.toDataURL('image/jpeg',.9),'JPEG',0,0,210,Math.min(297,cv.height*210/cv.width));
    }
    const tag = kind==='packing'?'ใบลงกล่อง' : kind==='receiving'?'ใบตรวจรับ' : 'ตรวจรับ+ลงกล่อง';
    const fname = 'SURU_' + trip().name.replace(/\s+/g,'_') + '_' + tag + '_' + new Date().toISOString().slice(0,10) + '.pdf';

    // บนมือถือ ใช้ share sheet ถ้าทำได้ ไม่งั้น save ปกติ
    let shared=false;
    try{
      if(navigator.canShare){
        const blob = pdf.output('blob');
        const file = new File([blob], fname, {type:'application/pdf'});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:fname}); shared=true; }
      }
    }catch(e){ shared=false; }
    if(!shared) pdf.save(fname);
    toast('สร้าง PDF แล้ว');
    stage.innerHTML=''; btn.textContent=label; btn.disabled=false;
  } catch(err){
    stage.innerHTML='';
    btn.textContent=label; btn.disabled=false;
    toast(err && err.message ? ('สร้าง PDF ไม่สำเร็จ: ' + err.message) : 'สร้าง PDF ไม่สำเร็จ ลองใหม่อีกครั้ง');
  }
}

boot();
</script>
